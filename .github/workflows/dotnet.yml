name: .NET

on:
  push:
    branches: ["product"]
  pull_request:
    branches: ["product"]

jobs:
  publish:
    uses: TechTeaStudio/.github/.github/workflows/nuget-publish-reusable.yml@main
    with:
      solution: WordDataBase.sln
      projects_glob: src/WordDataBase/WordDataBase.csproj
      skip_tests: false
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
